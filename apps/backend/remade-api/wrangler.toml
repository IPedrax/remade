name = "remade-api"
main = "build/index.js"
compatibility_date = "2026-10-06"
routes = [{ pattern = "api.remade.wiki", custom_domain = true }]
workers_dev = false
send_metrics = false

[dev]
host = "localhost:8787"
port = 8787
local_protocol = "http"
upstream_protocol = "http"

[vars]
FRONTEND_ORIGIN = "https://remade.wiki"
API_ORIGIN = "https://api.remade.wiki"

[[d1_databases]]
binding = "DB"
database_name = "remade-db"
# Local-only placeholder. Generated deployment config replaces this with D1_DATABASE_ID.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[build]
command = "cargo install -q worker-build --version 0.8.7 --locked && worker-build --release"
