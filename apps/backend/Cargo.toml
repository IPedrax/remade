[package]
name = "remade-api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
url = "2"
js-sys = "0.3"
wasm-bindgen = "0.2"
futures-util = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "WorkerGlobalScope"] }

[profile.release]
lto = true
opt-level = "s"
# wasm-bindgen needs the target_features custom section; strip only debug info.
strip = "debuginfo"
