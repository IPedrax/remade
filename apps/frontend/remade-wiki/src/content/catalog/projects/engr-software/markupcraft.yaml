# Scope and limitations are maintainer-reported in the repository README.
slug: markupcraft
name: MarkupCraft
authors: [engr-software]
repository: https://github.com/generalchad/markupcraft
originals: [bluebeam-revu]
category: engineering
languages: [Rust]
platforms: [Linux, macOS, Windows, FreeBSD, Web]
status: alpha
compatibility: partial
description: MarkupCraft by engr-software independently implements Revu-style PDF markup and quantity takeoff for construction drawings, with calibrated scales, measurements, a Markups List with totals, and reading and writing of Revu-compatible markups. It includes reusable tools, drawing comparisons and overlays, plus command-line and MCP interfaces.
license: MIT OR Apache-2.0
docs: https://github.com/generalchad/markupcraft#readme
limitations: Alpha. Proprietary formats without a public specification (tool sets, markup summaries) and binary DWG are not supported. Live cloud collaboration sessions, document-management integrations, Office and CAD authoring plugins and 3D PDF are not included. Full Revu compatibility is not claimed.
