# File-format and scripting fidelity are maintainer-reported; the application is headless.
slug: firecraft
name: FireCraft
authors: [aliasfoxkde]
repository: https://github.com/aliasfoxkde/FireCraft
originals: [adobe-fireworks]
category: creative
languages: [Rust]
status: experimental
compatibility: partial
description: An independent headless implementation targeting Fireworks CS6 document and scripting workflows. Provides Fireworks PNG reading and writing, vector and bitmap operations, text, symbols, a CPU compositor and JSF scripting commands. CLI tools inspect, convert, import and export documents and raster images.
license: MIT OR Apache-2.0
docs: https://github.com/aliasfoxkde/FireCraft/blob/main/docs/PROGRESS.md
limitations: Headless; desktop and WebAssembly interfaces remain in development. File round-trip and scripting fidelity are maintainer-reported, not independently verified across arbitrary Fireworks documents. The upstream progress matrix records partial commands and outstanding behavior differences; full CS6 application parity is not established.
