# Scope, compatibility and the clean-room process are maintainer-reported in the repository (README, CLEAN_ROOM.md, docs/compat/).
slug: zeroauthy
name: zeroauthy
authors: [thomasmeadows]
repository: https://github.com/occupysaas/zeroauthy
originals: [auth0]
category: developer-tools
languages: [Go]
platforms: [Linux, macOS, Windows]
status: alpha
compatibility: partial
description: A self-hosted identity server that aims to be wire-compatible with Auth0's Authentication API, so existing Auth0 SDKs work by changing the domain. It implements authorization code with PKCE, refresh token rotation, client credentials, password grants, the device flow, pushed authorization requests, consent, logout and hosted login pages, with database and custom-database connections and SQLite, PostgreSQL, MySQL or plugin storage.
license: Apache-2.0
docs: https://github.com/occupysaas/zeroauthy#readme
limitations: The Management API and admin console are in progress, so tenants are configured with a seed file for now. Social and enterprise connections, MFA, passwordless login, Actions and organizations are not implemented yet. OpenID certification is not yet granted. Compatibility claims are maintainer-reported.
