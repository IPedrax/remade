# Scope, status and limitations are maintainer-reported in the repository README.
slug: flare-animate
name: Flare
authors: [flare-animate]
repository: https://github.com/Flare-Animate/Flare
website: https://flare-animate.github.io/website/
originals: [adobe-animate]
category: creative
languages: [C++, Rust, Python]
platforms: [Linux, macOS, Windows]
status: alpha
compatibility: partial
description: Flare builds on OpenToonz with an Animate-style workspace and native Flash and Animate import. It is absorbing AnimationCraft capabilities into its Rust subsystems and integrating Next2Flash's ActionScript tooling through an optional sidecar.
license: BSD-3-Clause
docs: https://github.com/Flare-Animate/Flare#readme
limitations: Very early alpha; Flash and Animate import fidelity is incomplete. Native SWF import extracts headers and bitmaps; ActionScript tooling uses an optional Next2Flash sidecar, with full SWF round-trip integration still pending. AnimationCraft absorption is ongoing. OpenToonz-derived; third-party components retain their own licenses.
