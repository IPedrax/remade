slug: materialcraft
name: MaterialCraft
authors: [pijellypin]
repository: https://github.com/PiJellyPin/MaterialCraft
originals: [adobe-substance-3d-designer]
category: creative
languages: [Rust]
platforms: [Windows, Linux, macOS]
status: experimental
compatibility: partial
description: A Substance Designer-style procedural material editor with node graphs, generators, filters, subgraphs, 2D and 3D previews, mesh baking and command-line rendering. Uses its own graph and published-material formats.
license: MIT
docs: https://github.com/PiJellyPin/MaterialCraft#readme
limitations: Third-party material and project formats are unsupported. FX-Maps, function graphs, splines, color management, scripting, some import/export formats and custom preview meshes are missing. MIT is declared in Cargo.toml, but no standalone license file is included. Compatibility is not independently verified.
