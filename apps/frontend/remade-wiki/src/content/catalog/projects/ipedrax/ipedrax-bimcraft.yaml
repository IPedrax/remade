repository: https://github.com/IPedrax/BIMCraft
originals:
  - autodesk-revit
category: engineering
languages:
  - Rust
platforms:
  - Windows
  - Linux
  - macOS
status: experimental
compatibility: partial
description: An independently developed Revit-style building information modeler in Rust. Levels, walls, doors, windows, floors, roofs, rooms, stairs, families and schedules share one model that produces plans, sections, elevations, 3D views and printable sheets. Exchanges models through IFC and exposes commands through a desktop app, CLI and MCP server.
license: MIT OR Apache-2.0
docs: https://github.com/IPedrax/BIMCraft#readme
limitations: Early development; compatibility is maintainer-reported. Revit's closed .rvt format is not read and families are BIMCraft's own JSON, never .rfa, so IFC is the way in and out. Several people editing one model is not supported. The macOS app is untried on a Mac and installers are unsigned. A separate project from getcadcraft's BimCraft.
summary: Revit-style building modeling with coordinated plans, sections, schedules, sheets and IFC exchange.
