# Current implementation scope follows the upstream M0 roadmap, not its planned feature list.
slug: oxiguitar
name: OxiGuitar
authors: [mateusrdp]
repository: https://github.com/mateusrdp/oxiguitar
originals: [guitar-pro]
category: creative
languages: [Rust]
platforms: [Windows, macOS, Linux]
status: experimental
compatibility: partial
description: Early Rust implementation targeting Guitar Pro's tablature, notation, editing and playback workflows. Its current command-line tool reads Guitar Pro 3, 4 and 5 files and reports their score structure. A desktop viewer, editor and MIDI player are planned, followed by broader Guitar Pro 8 compatibility.
license: GPL-3.0-or-later
docs: https://github.com/mateusrdp/oxiguitar/blob/develop/ROADMAP.md
limitations: Foundations stage; no usable graphical viewer, editor or playback yet. Newer Guitar Pro formats and exports remain planned. Interactive testing is currently limited to Debian Linux. Current code declares GPL-3.0-or-later; planned MuseScore code ports would constrain the combined program to GPL-3.0-only.
