slug: craftpulse
name: CraftPulse
authors: [egsk4]
repository: https://github.com/egsk4/CraftPulse
url: https://github.com/egsk4/CraftPulse
languages: [Rust]
platforms: [Windows, macOS, Linux]
license: MIT
status: experimental
description: Discord Rich Presence companion for ArtCraft apps, showing the active app, project and activity. Runs in the system tray with local detection, privacy controls and configurable activities.
limitations: Very early development; detection can be wrong, delayed or incomplete. Recognizes seven apps, with PhotoCraft and LightCraft the current focus. Windows supports detailed activity detection; macOS and Linux support app and window-title detection only. Linux uses X11.
projects: [photocraft, vectorcraft, filmcraft, lightcraft, pdfcraft, effectcraft, designcraft]
