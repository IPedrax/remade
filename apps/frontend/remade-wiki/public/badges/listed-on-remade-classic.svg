<svg xmlns="http://www.w3.org/2000/svg" width="115" height="20" viewBox="0 0 115 20" role="img" aria-label="Listed on Remade">
  <title>Listed on Remade</title>
  <defs>
    <clipPath id="badge-corners">
      <rect width="115" height="20" rx="3"/>
    </clipPath>
    <linearGradient id="badge-sheen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset=".48" stop-color="#FFFFFF" stop-opacity=".03"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".16"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#badge-corners)">
    <rect width="60" height="20" fill="#555555"/>
    <rect x="60" width="55" height="20" fill="#A8D95A"/>
    <rect width="115" height="20" fill="url(#badge-sheen)"/>
    <path d="M59.5 0V20" stroke="#000000" stroke-opacity=".22" stroke-width="1"/>
  </g>
  <g font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" text-rendering="geometricPrecision">
    <text x="30" y="15" fill="#000000" fill-opacity=".4">Listed on</text>
    <text x="30" y="14" fill="#FFFFFF">Listed on</text>
    <text x="87.5" y="15" fill="#000000" fill-opacity=".25">Remade</text>
    <text x="87.5" y="14" fill="#FFFFFF">Remade</text>
  </g>
</svg>
