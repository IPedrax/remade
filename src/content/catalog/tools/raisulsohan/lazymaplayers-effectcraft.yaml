limitations: Requires Node.js 22 or newer, Edge or Chrome, and a separate LazyMapLayers checkout. The author reported host API gaps during porting, including undo groups, object identity, removeKey performance and matchNames; consult the repository for current coverage.
description: "Map animation panel for EffectCraft: globe-to-street flights, routes, labels in every script, data maps and historical maps. The author reports all 369 generated expression kinds match After Effects' maths. The original host script runs unchanged through a small compatibility layer, with a separate panel window communicating over --control."
projects: [effectcraft]
