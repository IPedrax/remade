[project]
name = "remade-tooling"
version = "0.1.0"
description = "Validation and maintenance tooling for remade.wiki"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.14.0",
    "PyYAML==6.0.3",
    "requests==2.32.5",
    "typer==0.26.3",
    "validators==0.35.0",
]

[tool.uv]
package = false

# The tooling project is the workspace root. Add member packages here
# only if the Python tooling eventually grows beyond a single project.
[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.14"
