[project]
name = "remade-tooling"
version = "0.1.0"
description = "Validation and maintenance tooling for remade.wiki"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PyYAML==6.0.3",
    "requests==2.32.5",
    "typer==0.26.3",
    "validators==0.35.0",
]

[tool.uv]
package = false

# The tooling project is the workspace root. Add member packages here
# only if the Python tooling eventually grows beyond a single project.
[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
