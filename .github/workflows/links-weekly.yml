name: Weekly Catalog Link Audit

on:
  schedule:
    - cron: '17 8 * * 0' # Sundays at 08:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Weekly Catalog Link Audit
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.13.0'
          working-directory: scripts
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Generate explicit URL list from catalog files
        id: url_list
        run: |
          mkdir -p .generated
          uv run --project scripts python scripts/catalog_links.py --all > .generated/catalog-urls.txt
          if [ -s .generated/catalog-urls.txt ]; then
            echo 'has_urls=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_urls=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v6.1.0
        if: steps.url_list.outputs.has_urls == 'true'
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lychee-${{ runner.os }}-
      - name: Check full catalog URLs
        timeout-minutes: 10
        continue-on-error: true
        if: steps.url_list.outputs.has_urls == 'true'
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          output: lychee/catalog-report.md
          args: --config lychee.toml --cache --verbose --no-progress .generated/catalog-urls.txt
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save link-check reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: weekly-catalog-link-reports
          path: lychee/*-report.md
          if-no-files-found: ignore
          retention-days: 7
