name: Dead Link Checker

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lychee:
    name: Dead Link Checker
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.13.0'
          working-directory: scripts
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Generate explicit URL list from catalog files
        id: url_list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p .generated
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            uv run --project scripts python scripts/catalog_links.py --changed-from "$BASE_SHA" > .generated/catalog-urls.txt
          else
            echo "::error::The base revision is unavailable; use Weekly Catalog Link Audit for a full audit."
            exit 1
          fi
          if [ -s .generated/catalog-urls.txt ]; then
            echo 'has_urls=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_urls=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v6.1.0
        if: steps.url_list.outputs.has_urls == 'true'
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lychee-${{ runner.os }}-
      - name: Check newly added catalog URLs
        timeout-minutes: 10
        continue-on-error: true
        if: steps.url_list.outputs.has_urls == 'true'
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          output: lychee/catalog-report.md
          args: --config lychee.toml --cache --verbose --no-progress .generated/catalog-urls.txt
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save link-check reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dead-link-reports
          path: lychee/*-report.md
          if-no-files-found: ignore
          retention-days: 7
