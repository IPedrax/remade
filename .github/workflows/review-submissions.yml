name: Review catalog suggestions and requests

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: contains(github.event.issue.labels.*.name, 'catalog-suggestion') || contains(github.event.issue.labels.*.name, 'project-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.13.0'
          working-directory: scripts
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Analyze submission and collect safe URLs
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .generated
          uv run --project scripts python scripts/review_submission.py prepare --report .generated/submission.json --urls .generated/submission-urls.txt
          if [ -s .generated/submission-urls.txt ]; then
            echo "has_urls=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check submitted links with Lychee
        if: steps.prepare.outputs.has_urls == 'true'
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml --exclude-all-private --no-progress --exclude '^https://(github\.com|api\.github\.com|raw\.githubusercontent\.com)(/|$)' .generated/submission-urls.txt
          failIfEmpty: false
          fail: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check submitted GitHub links strictly
        if: steps.prepare.outputs.has_urls == 'true'
        id: lychee_github
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          output: lychee/github-report.md
          args: --config lychee.toml --cache=false --exclude-all-private --no-progress --exclude '.*' --include '^https://(github\.com|api\.github\.com|raw\.githubusercontent\.com)(/|$)' --accept '200..=299' .generated/submission-urls.txt
          fail: false
          failIfEmpty: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish or update review comment
        if: always() && hashFiles('.generated/submission.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LYCHEE_EXIT: ${{ steps.lychee.outputs.exit_code == '0' && steps.lychee_github.outputs.exit_code == '0' && '0' || '1' }}
        run: uv run --project scripts python scripts/review_submission.py publish --report .generated/submission.json --lychee-exit "$LYCHEE_EXIT"
