# Lychee, used for catalog URLs / docs and generated Astro HTML.
cache = true
# Tolerate bot-blocking 403s on general websites. External workflows check
# GitHub hosts separately with --accept '200..=299' and without cached results.
accept = ["200..=299", "403"]
max_cache_age = "1d"
max_retries = 2
retry_wait_time = 2
timeout = 20
max_concurrency = 8
host_concurrency = 2
host_request_interval = "250ms"
exclude_all_private = true
index_files = ["index.html"]
